CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

# PMW3610 is auto-enabled via DT_HAS_PIXART_PMW3610_ENABLED
# (Zephyr native driver: drivers/input/Kconfig.pmw3610)
# CPI, invert, smart-mode, force-awake are set via DTS properties
# in keyball39_right.overlay

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
